name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify library ABI compatibility
        run: ./gradlew library:checkKotlinAbi

      - name: Assemble stable debug APK
        run: ./gradlew assembleStableDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hmcs-stable-debug
          path: app/build/outputs/apk/stable/debug/*.apk
          retention-days: 14
